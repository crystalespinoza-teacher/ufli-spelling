<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFLI Lesson 45 — sh Spelling Practice</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f2f4f6;font-family:Arial,sans-serif}#app{max-width:880px;margin:auto}.screen{background:#f8d94f;border-radius:18px;overflow:hidden;border:1px solid #ccc;box-shadow:0 4px 14px #0001}.top{background:#0f5f8f;color:white;padding:16px 20px;font-size:21px;font-weight:800}.instructions{padding:14px 18px;font-size:16px}.panel{display:grid;grid-template-columns:180px 1fr;margin:0 18px 18px;background:white;border-radius:15px;overflow:hidden}.buttons{background:#f7c82d;padding:17px;display:flex;flex-direction:column;gap:12px}.audio{display:flex;align-items:center;gap:10px;background:transparent;border:0;font-size:17px;font-weight:800;min-height:44px;cursor:pointer}.speaker{width:38px;height:38px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center}.message{background:#d9eff8;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;font-size:21px;font-weight:800;text-align:center;color:#154b69}.entry{margin:0 18px 14px;background:white;padding:22px 18px;border-radius:8px}.message strong{display:block;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:48px;letter-spacing:4px;color:#111}.type-zone{position:relative;min-height:90px;cursor:text}.boxes{display:flex;justify-content:center;gap:12px;min-height:90px;pointer-events:none}.box{width:76px;height:82px;border:3px solid #4a8fb7;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;font-size:58px;color:#111;background:white}.type-input{position:absolute;inset:0;width:100%;height:100%;opacity:.01;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:40px;z-index:5;cursor:text}.type-input:focus{outline:none}.hint{text-align:center;margin-top:10px;color:#555}.result{margin:0 18px 14px;padding:12px;background:#fff6bf;border-radius:10px;text-align:center;font-weight:700;min-height:48px}.result.is-correct{background:#ddf3e7;color:#163e2d;font-size:23px}.result.is-correct strong{font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:38px;letter-spacing:3px;color:#111}.correct{font-family:"Comic Sans MS","Chalkboard SE",sans-serif;font-size:38px;letter-spacing:4px}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px 18px;flex-wrap:wrap}.nav,.check{min-height:45px;border-radius:999px;padding:0 20px;font-weight:800;border:1px solid #aaa;cursor:pointer}.nav{background:white}.check{background:#0f5f8f;color:white}.progress{font-weight:800;color:#154b69}@media(max-width:650px){body{padding:10px}.panel{grid-template-columns:1fr}.buttons{display:grid;grid-template-columns:repeat(3,1fr);padding:8px;gap:2px}.audio{flex-direction:column;justify-content:center;font-size:14px}.boxes{gap:5px}.box{width:min(16vw,60px);height:70px;font-size:46px}.controls{justify-content:center}.instructions{font-size:15px}}
</style>
</head>
<body><div id="app"><div class="screen">
<div class="top">UFLI Lesson 45: Words with sh</div>
<div class="instructions">Listen to the word, its spelling, and how it is used in a sentence. Type the word. Then select <b>Check</b>.</div>
<div class="panel"><div class="buttons"><button class="audio" id="word"><span class="speaker">🔊</span>Word</button><button class="audio" id="spell"><span class="speaker">🔊</span>Spelling</button><button class="audio" id="sentence"><span class="speaker">🔊</span>Sentence</button></div><div class="message" id="msg" aria-live="polite">Press a speaker button to listen.</div></div>
<div class="entry"><div class="type-zone" id="typeZone"><div class="boxes" id="boxes" aria-hidden="true"></div><input id="input" class="type-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type the spelling word"></div><div class="hint">Click the boxes, then type the word. Each letter gets its own box.</div></div>
<div class="result" id="result" aria-live="polite">Type the word, then press Check.</div>
<div class="controls"><button class="nav" id="prev">◀ Previous</button><span class="progress" id="progress">1 of 7</span><button class="check" id="check">✓ CHECK</button><button class="nav" id="next">Next ▶</button></div>
</div></div>
<script>
const data=[
 {w:'ship',s:'The ship sails on the sea.'},
 {w:'shop',s:'We went to the shop.'},
 {w:'shut',s:'Please shut the gate.'},
 {w:'shed',s:'The tools are in the shed.'},
 {w:'fish',s:'The fish swims in the pond.'},
 {w:'dish',s:'I put my dish on the table.'},
 {w:'rush',s:'Do not rush down the hall.'}
];
let n=0,typed='',audioRun=0;
const boxes=document.getElementById('boxes'),input=document.getElementById('input'),msg=document.getElementById('msg'),result=document.getElementById('result'),progress=document.getElementById('progress'),prev=document.getElementById('prev');
function voice(){const v=speechSynthesis.getVoices();return v.find(x=>/Google US English/i.test(x.name))||v.find(x=>/Samantha/i.test(x.name))||v.find(x=>x.lang==='en-US')||null}
function say(t,rate,run){return new Promise(done=>{if(run!==audioRun)return done();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.pitch=1;const v=voice();if(v)u.voice=v;u.onend=done;u.onerror=done;speechSynthesis.speak(u)})}
function draw(){boxes.replaceChildren();[...data[n].w].forEach((_,j)=>{const b=document.createElement('div');b.className='box';b.textContent=typed[j]||'';boxes.appendChild(b)})}
function reset(){audioRun++;speechSynthesis.cancel();typed='';input.value='';msg.textContent='Press a speaker button to listen.';result.textContent='Type the word, then press Check.';result.classList.remove('is-correct');progress.textContent=`${n+1} of ${data.length}`;prev.disabled=n===0;draw();input.focus()}
input.addEventListener('input',()=>{typed=input.value.toLowerCase().replace(/[^a-z]/g,'').slice(0,data[n].w.length);input.value=typed;draw();result.textContent='Type the word, then press Check.';result.classList.remove('is-correct')});document.getElementById('typeZone').onclick=()=>input.focus();
async function play(kind){const run=++audioRun;speechSynthesis.cancel();if(!('speechSynthesis' in window)){msg.textContent='Audio is unavailable in this browser.';return}msg.textContent=kind==='word'?'Listen to the word.':kind==='spell'?'Listen to each letter.':'Listen to the sentence.';if(kind==='spell'){for(const letter of data[n].w){if(run!==audioRun)return;await say(letter,.7,run);await new Promise(r=>setTimeout(r,160))}}else await say(kind==='word'?data[n].w+'.':data[n].s,kind==='word'?.78:.82,run);if(run===audioRun)input.focus()}
for(const kind of ['word','spell','sentence'])document.getElementById(kind).onclick=()=>play(kind);
document.getElementById('check').onclick=()=>{audioRun++;speechSynthesis.cancel();if(typed===data[n].w){result.classList.add('is-correct');result.innerHTML='✓ Correct! &nbsp;<strong>'+data[n].w+'</strong>'}else{msg.innerHTML='Correct spelling:<strong>'+data[n].w+'</strong>';result.classList.remove('is-correct');result.textContent='Compare your letters with the correct spelling above.'}input.focus()};document.getElementById('next').onclick=()=>{n=(n+1)%data.length;reset()};prev.onclick=()=>{if(n>0){n--;reset()}};input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('check').click()});if('speechSynthesis' in window)speechSynthesis.getVoices();reset();
</script></body></html>
