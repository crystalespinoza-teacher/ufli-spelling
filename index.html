<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short U Spelling Practice</title>
<style>
:root{
  --yellow:#f7d846;
  --deep-blue:#145f8c;
  --light-blue:#dceff7;
  --box-blue:#4c8fb4;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px;
  background:#eef2f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#193448;
}
.app{
  max-width:920px;
  margin:0 auto;
  background:var(--yellow);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.12);
}
.title{
  background:var(--deep-blue);
  color:white;
  padding:18px 22px;
  font-size:25px;
  font-weight:800;
}
.instructions{
  padding:16px 22px 12px;
  font-size:17px;
  line-height:1.45;
}
.listen{
  display:grid;
  grid-template-columns:190px 1fr;
  margin:0 22px 20px;
  background:white;
  border-radius:16px;
  overflow:hidden;
}
.listen-buttons{
  background:#f3c831;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.listen button{
  border:0;
  background:transparent;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}
.speaker{
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.08);
}
.message{
  min-height:165px;
  background:var(--light-blue);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:800;
  color:#18516f;
}
.work{
  margin:0 22px 14px;
  background:white;
  padding:24px 18px 18px;
  border-radius:10px;
}
.type-zone{
  position:relative;
  min-height:92px;
  cursor:text;
}
.boxes{
  min-height:92px;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  pointer-events:none;
}
.box{
  min-width:78px;
  height:84px;
  padding:0 12px;
  border:3px solid var(--box-blue);
  border-radius:11px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  font-size:57px;
  line-height:1;
  color:#111;
}
.box.multi{
  min-width:105px;
}
.capture{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.01;
  border:0;
  background:transparent;
  color:transparent;
  caret-color:transparent;
  font-size:40px;
  cursor:text;
}
.capture:focus{outline:none}
.hint{
  margin-top:10px;
  text-align:center;
  color:#5c6770;
  font-size:14px;
}
.result{
  margin:0 22px 14px;
  min-height:56px;
  padding:12px 16px;
  border-radius:10px;
  background:#fff5bd;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:17px;
  font-weight:750;
}
.correct-word{
  margin-left:8px;
  font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  font-size:38px;
  letter-spacing:3px;
}
.controls{
  padding:0 22px 22px;
  display:grid;
  grid-template-columns:1fr auto auto auto;
  align-items:center;
  gap:12px;
}
.btn{
  border-radius:999px;
  min-height:46px;
  padding:0 21px;
  border:1px solid rgba(0,0,0,.24);
  font-weight:800;
  font-size:15px;
  cursor:pointer;
}
.nav{background:white;color:#24465b}
.check{background:var(--deep-blue);color:white}
.progress{
  font-weight:800;
  color:#18516f;
  min-width:62px;
  text-align:center;
}
button:disabled{opacity:.45;cursor:default}
@media (max-width:650px){
  body{padding:10px}
  .listen{grid-template-columns:1fr}
  .listen-buttons{display:grid;grid-template-columns:repeat(3,1fr);padding:12px}
  .listen button{flex-direction:column;justify-content:center;font-size:14px}
  .message{min-height:110px;font-size:19px}
  .box{min-width:62px;height:70px;font-size:47px}
  .box.multi{min-width:88px}
  .controls{grid-template-columns:1fr 1fr;justify-items:stretch}
  .progress{grid-column:1/-1;grid-row:1}
}
</style>
</head>
<body>
<main class="app">
  <div class="title">Spelling: Words with Short U</div>
  <div class="instructions">
    Listen to the word, its spelling, and how it is used in a sentence.
    Type the word. Then select <strong>Check</strong>.
  </div>

  <section class="listen">
    <div class="listen-buttons">
      <button id="wordBtn" type="button"><span class="speaker">🔊</span>Word</button>
      <button id="spellBtn" type="button"><span class="speaker">🔊</span>Spelling</button>
      <button id="sentenceBtn" type="button"><span class="speaker">🔊</span>Sentence</button>
    </div>
    <div class="message" id="message">Press a speaker button to listen.</div>
  </section>

  <section class="work">
    <div class="type-zone" id="typeZone">
      <div class="boxes" id="boxes"></div>
      <input class="capture" id="capture" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type the spelling word">
    </div>
    <div class="hint">Click the boxes and type the word.</div>
  </section>

  <div class="result" id="result">Type the word, then press Check.</div>

  <div class="controls">
    <button class="btn nav" id="prevBtn" type="button">◀ Previous</button>
    <div class="progress" id="progress">1 of 5</div>
    <button class="btn check" id="checkBtn" type="button">✓ CHECK</button>
    <button class="btn nav" id="nextBtn" type="button">Next ▶</button>
  </div>
</main>

<script>
const items = [
  {word:"sun", chunks:["s","u","n"], sentence:"The sun is hot."},
  {word:"bus", chunks:["b","u","s"], sentence:"We ride the bus."},
  {word:"mud", chunks:["m","u","d"], sentence:"The pig is in the mud."},
  {word:"cut", chunks:["c","u","t"], sentence:"I can cut the paper."},
  {word:"cup", chunks:["c","u","p"], sentence:"The cup is on the table."}
];

let index = 0;
let typed = "";

const boxes = document.getElementById("boxes");
const capture = document.getElementById("capture");
const result = document.getElementById("result");
const message = document.getElementById("message");
const progress = document.getElementById("progress");
const prevBtn = document.getElementById("prevBtn");

function chooseVoice(){
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /Google US English/i.test(v.name))
      || voices.find(v => /Samantha/i.test(v.name))
      || voices.find(v => /Microsoft.*Aria/i.test(v.name))
      || voices.find(v => v.lang === "en-US")
      || voices.find(v => v.lang && v.lang.startsWith("en"))
      || null;
}

function speak(text, rate){
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate;
    u.pitch = 1;
    u.volume = 1;
    const voice = chooseVoice();
    if (voice) u.voice = voice;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function chunkTypedText(){
  const lengths = items[index].chunks.map(c => c.length);
  const pieces = [];
  let pos = 0;
  for(const len of lengths){
    pieces.push(typed.slice(pos, pos + len));
    pos += len;
  }
  return pieces;
}

function drawBoxes(){
  boxes.innerHTML = "";
  const shown = chunkTypedText();
  items[index].chunks.forEach((chunk, i) => {
    const box = document.createElement("div");
    box.className = "box" + (chunk.length > 1 ? " multi" : "");
    box.textContent = shown[i] || "";
    boxes.appendChild(box);
  });
}

function reset(){
  typed = "";
  capture.value = "";
  result.textContent = "Type the word, then press Check.";
  message.textContent = "Press a speaker button to listen.";
  progress.textContent = `${index + 1} of ${items.length}`;
  prevBtn.disabled = index === 0;
  drawBoxes();
  setTimeout(() => capture.focus(), 50);
}

document.getElementById("typeZone").addEventListener("click", () => capture.focus());

capture.addEventListener("input", () => {
  const max = items[index].word.length;
  typed = capture.value.toLowerCase().replace(/[^a-z]/g, "").slice(0, max);
  capture.value = typed;
  drawBoxes();
});

document.getElementById("wordBtn").addEventListener("click", async () => {
  message.textContent = "Listen to the word.";
  speechSynthesis.cancel();
  await speak(items[index].word + ".", 0.78);
  capture.focus();
});

document.getElementById("spellBtn").addEventListener("click", async () => {
  message.textContent = "Listen to each letter.";
  speechSynthesis.cancel();
  for(const letter of items[index].word.split("")){
    await speak(letter, 0.70);
    await new Promise(r => setTimeout(r, 150));
  }
  capture.focus();
});

document.getElementById("sentenceBtn").addEventListener("click", async () => {
  message.textContent = "Listen to the sentence.";
  speechSynthesis.cancel();
  await speak(items[index].sentence, 0.82);
  capture.focus();
});

document.getElementById("checkBtn").addEventListener("click", () => {
  const correct = items[index].word;
  result.innerHTML = typed === correct
    ? `✓ Correct! <span class="correct-word">${correct}</span>`
    : `Correct spelling: <span class="correct-word">${correct}</span>`;
  capture.focus();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  index = (index + 1) % items.length;
  reset();
});

prevBtn.addEventListener("click", () => {
  if(index > 0){
    index--;
    reset();
  }
});

capture.addEventListener("keydown", e => {
  if(e.key === "Enter"){
    document.getElementById("checkBtn").click();
  }
});

if("speechSynthesis" in window){
  speechSynthesis.getVoices();
}
reset();
</script>
</body>
</html>
